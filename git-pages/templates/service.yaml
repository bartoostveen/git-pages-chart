apiVersion: v1
kind: Service
metadata:
  name: {{ include "git-pages.fullname" . }}
  labels:
    {{- include "git-pages.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.caddyPort }}
      targetPort: caddy
      protocol: TCP
      name: caddy
    - port: {{ .Values.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "git-pages.selectorLabels" . | nindent 4 }}
